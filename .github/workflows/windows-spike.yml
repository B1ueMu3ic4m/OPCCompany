name: Windows Port Spike (M1)

# Manual, cloud-hosted Windows compile experiment (see docs/WINDOWS_PORT_RFC.md).
# No local Windows machine needed: runs on a GitHub-hosted windows-latest runner,
# installs the official Swift toolchain, and measures how much of OPCCompanyCore
# compiles on Windows. Logs are uploaded as artifacts + a summary on the run page.

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $urls = @(
            "https://download.swift.org/swift-6.3-release/windows10/swift-6.3-RELEASE/swift-6.3-RELEASE-windows10.exe",
            "https://download.swift.org/swift-6.1.2-release/windows10/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-windows10.exe"
          )
          # The Inno Setup GUI installer hangs on headless runners (prerequisite
          # check pops UI regardless of silent flags). 7-Zip can't read Inno's
          # embedded data (only sees 9 stub files). innoextract is purpose-built
          # for Inno containers — download it and extract the toolchain directly.
          Write-Host "Fetching innoextract…"
          curl.exe -sSL --fail --max-time 120 -o "$env:RUNNER_TEMP\innoextract.zip" `
            "https://innoextract.constexpr.org/static/download/archives/innoextract-1.9-windows.zip"
          # Expand-Archive crashes on pwsh 7 runners (GAC probe → OperationStopped);
          # 7-Zip handles plain zips fine — it was only blind to Inno's format.
          & "C:\Program Files\7-Zip\7z.exe" x -y "-o$env:RUNNER_TEMP\innoextract" "$env:RUNNER_TEMP\innoextract.zip" | Select-Object -Last 2
          $inno = Get-ChildItem "$env:RUNNER_TEMP\innoextract" -Recurse -Filter innoextract.exe | Select-Object -First 1
          if (-not $inno) { Write-Error "innoextract missing"; exit 1 }
          $installed = $false
          foreach ($u in $urls) {
            Write-Host "Trying $u"
            curl.exe -sSL --fail --max-time 600 -o "$env:RUNNER_TEMP\swift-installer.exe" $u
            if ($LASTEXITCODE -ne 0) { Write-Host "download failed"; continue }
            Write-Host "Downloaded $((Get-Item "$env:RUNNER_TEMP\swift-installer.exe").Length) bytes; extracting…"
            & $inno.FullName "$env:RUNNER_TEMP\swift-installer.exe" -e -d "$env:RUNNER_TEMP\swift" 2>&1 | Select-Object -Last 5
            $exe = Get-ChildItem "$env:RUNNER_TEMP\swift" -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($exe) {
              $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $installed = $true
              Write-Host "swift.exe at: $($exe.FullName)"
              break
            } else {
              Write-Host "no swift.exe after extract; top-level:"
              Get-ChildItem "$env:RUNNER_TEMP\swift" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
            }
          }
          if (-not $installed) { Write-Error "No Swift toolchain installed"; exit 1 }
          swift --version

      - name: Run spike
        shell: pwsh
        run: ./scripts/windows-spike.ps1

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-logs
          path: spike-*.txt
          if-no-files-found: warn
