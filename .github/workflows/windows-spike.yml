name: Windows Port Spike (M1)

# Manual, cloud-hosted Windows compile experiment (see docs/WINDOWS_PORT_RFC.md).
# The Swift Windows installer is a WiX Burn bundle; install it with its own
# /quiet CLI, ensure the VC++ 2022 runtime it links against is present, then
# diagnose swift.exe before building.

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # Swift's toolchain binaries link against VC++ 2022 (VCRUNTIME140.dll
          # etc). A missing/incompatible runtime makes swift.exe fail SILENTLY
          # with exit 0xC0000135 (STATUS_DLL_NOT_FOUND) — exactly run #16's
          # symptom (exe found, --version produced no output, exit 1).
          Write-Host "=== ensuring VC++ 2022 runtime ==="
          winget install --id Microsoft.VCRedist.2015+.x64 -e --accept-source-agreements --accept-package-agreements --silent 2>&1 | Select-Object -Last 2

          $url = "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          curl.exe -sSL --fail --max-time 600 -o $installer $url
          Write-Host "downloaded $((Get-Item $installer).Length) bytes"
          $p = Start-Process $installer -ArgumentList "/quiet","/norestart","/l*v","$env:RUNNER_TEMP\swift-install.log" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"

          $candidates = @("$env:LOCALAPPDATA\Programs\Swift", "C:\Program Files\Swift")
          $exe = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              $exe = Get-ChildItem $c -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) { break }
            }
          }
          if (-not $exe) { Write-Host "swift.exe NOT FOUND"; exit 1 }
          $bin = $exe.DirectoryName
          Write-Host "swift.exe at $bin"

          function Try-Swift($label, $wd) {
            $o = "$env:RUNNER_TEMP\so.txt"; $e = "$env:RUNNER_TEMP\se.txt"
            Remove-Item $o,$e -ErrorAction SilentlyContinue
            $sp = Start-Process $exe.FullName -ArgumentList "--version" -PassThru -Wait -WorkingDirectory $wd -RedirectStandardOutput $o -RedirectStandardError $e
            $code = $sp.ExitCode
            $hex = if ($code -lt 0) { "0x" + ('{0:X8}' -f ([uint32]($code -band 0xFFFFFFFF))) } else { "0x{0:X}" -f $code }
            Write-Host "[$label] exit=$code ($hex)"
            $out = (Get-Content $o -Raw -ErrorAction SilentlyContinue)
            $err = (Get-Content $e -Raw -ErrorAction SilentlyContinue)
            if ($out) { Write-Host "  stdout: $out" }
            if ($err) { Write-Host "  stderr: $err" }
            return $code
          }
          $rc = Try-Swift "cwd=temp" $env:RUNNER_TEMP
          if ($rc -ne 0) { $rc = Try-Swift "cwd=bin" $bin }
          if ($rc -ne 0) {
            Write-Host "=== bin dir listing ==="
            Get-ChildItem $bin -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Host "=== install log tail ==="
            Get-Content "$env:RUNNER_TEMP\swift-install.log" -Tail 25 -ErrorAction SilentlyContinue
            exit 1
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "swift OK, on PATH for later steps"

      - name: Run spike
        shell: pwsh
        run: ./scripts/windows-spike.ps1

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-logs
          path: |
            spike-*.txt
            spike-census.json
          if-no-files-found: warn
