name: Windows Port Spike (M1)

# Manual, cloud-hosted Windows compile experiment (see docs/WINDOWS_PORT_RFC.md).
# The Swift Windows installer is a WiX Burn bundle; install it with its own
# /quiet CLI, then make the whole toolchain's DLLs resolvable before running.

on:
  workflow_dispatch:

jobs:
  spike:
    # windows-latest now ships VS 2026 (v18); Swift 6.3.3's driver fails SDK
    # detection against it → 'unable to load standard library'. Pin the
    # windows-2022 image (VS 17), which is the toolset Swift on Windows
    # officially supports.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $url = "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          curl.exe -sSL --fail --max-time 600 -o $installer $url
          Write-Host "downloaded $((Get-Item $installer).Length) bytes"
          # Machine scope writes HKLM\SOFTWARE\Swift\Platforms, which is where
          # swift-driver looks for the Windows.platform (holding the stdlib).
          # Per-user install (run #21) wrote only HKCU → driver found no platform
          # → "unable to load standard library" despite a valid toolchain.
          $p = Start-Process $installer -ArgumentList "/quiet","/norestart","INSTALLSCOPE=machine","/l*v","$env:RUNNER_TEMP\swift-install.log" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"

          # Run #22 crashed 0xC00000FD (stack overflow) inside the PowerShell
          # registry provider's -Recurse walk — the machine-scope install itself
          # had already succeeded (exit 0). Non-recursive top-level keys only.
          Write-Host "=== HKLM Swift registry (top-level) ==="
          Get-ChildItem "HKLM:\SOFTWARE\Swift" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }

          $root = "C:\Program Files\Swift"
          if (-not (Test-Path $root)) { $root = "$env:LOCALAPPDATA\Programs\Swift" }
          Write-Host "=== Swift root tree (depth 2) ==="
          Get-ChildItem $root -Recurse -Depth 2 -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName.Substring($root.Length))" }
          $exe = Get-ChildItem $root -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "swift.exe NOT FOUND"; exit 1 }
          $bin = $exe.DirectoryName

          # Run #17: exit 0xC0000135 (DLL_NOT_FOUND) even with VC++ redist
          # present. The toolchain's own DLLs live in sibling dirs (usr/lib,
          # Platforms\*\Windows\lib, Runtimes) that aren't in the default
          # search path. Put every dir containing *.dll on PATH, then retry.
          $dllDirs = Get-ChildItem $root -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
                     Select-Object -ExpandProperty DirectoryName -Unique
          $env:PATH = ($dllDirs -join ';') + ';' + $env:PATH
          Write-Host "added $($dllDirs.Count) DLL dirs to PATH"

          function Try-Swift($label) {
            $o = "$env:RUNNER_TEMP\so.txt"; $e = "$env:RUNNER_TEMP\se.txt"
            Remove-Item $o,$e -ErrorAction SilentlyContinue
            $sp = Start-Process $exe.FullName -ArgumentList "--version" -PassThru -Wait -WorkingDirectory $bin -RedirectStandardOutput $o -RedirectStandardError $e
            $code = $sp.ExitCode
            $hex = '0x{0:X8}' -f ([uint32]($code -band 0xFFFFFFFF))
            Write-Host "[$label] exit=$code ($hex)"
            $out = (Get-Content $o -Raw -ErrorAction SilentlyContinue)
            $err = (Get-Content $e -Raw -ErrorAction SilentlyContinue)
            if ($out) { Write-Host "  stdout: $out" }
            if ($err) { Write-Host "  stderr: $err" }
            return $code
          }
          $rc = Try-Swift "path-injected"
          if ($rc -ne 0) {
            Write-Host "=== still failing: dumpbin dependents ==="
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>$null
            $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
            if ($dumpbin) {
              # Run dumpbin inside a vcvars shell so its own deps resolve.
              $cmd = "`"$($dumpbin.FullName)`" /dependents `"$($exe.FullName)`""
              cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul 2>&1 && $cmd" 2>&1 | Select-Object -Last 40
            } else { Write-Host "dumpbin not found" }
            exit 1
          }
          "$bin;$($dllDirs -join ';')" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "swift OK; PATH exported for later steps"

      - name: Run spike
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find VC\Auxiliary\Build\vcvars64.bat > vcvars-path.txt 2>nul
          set /p VCVARS=<vcvars-path.txt
          echo VCVARS=%VCVARS%
          call "%VCVARS%"
          echo WindowsSdkDir=%WindowsSdkDir%
          pwsh -NoProfile -File scripts\windows-spike.ps1

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-logs
          path: |
            spike-*.txt
            spike-census.json
          if-no-files-found: warn
