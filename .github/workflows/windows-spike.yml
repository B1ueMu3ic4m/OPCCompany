name: Windows Port Spike (M1)

# Manual, cloud-hosted Windows compile experiment (see docs/WINDOWS_PORT_RFC.md).
# The Swift Windows installer is a WiX Burn bundle: install it silently with
# its OWN CLI (/quiet /norestart — the Inno-style /VERYSILENT from run #3 is
# what hung it on a GUI), then locate swift.exe.

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          curl.exe -sSL --fail --max-time 600 -o $installer $url
          Write-Host "downloaded $((Get-Item $installer).Length) bytes"
          # WiX Burn bootstrapper CLI: /quiet /norestart /l*v <log>.
          # Run #3 hung because it passed Inno's /VERYSILENT, which Burn ignores.
          $p = Start-Process $installer -ArgumentList "/quiet","/norestart","/l*v","$env:RUNNER_TEMP\swift-install.log" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Host "--- install log tail ---"
            Get-Content "$env:RUNNER_TEMP\swift-install.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
          # Burn installs per-user to %LOCALAPPDATA%\Programs\Swift (scoop's
          # manifest confirms this layout); machine-wide goes to Program Files.
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Swift",
            "C:\Program Files\Swift"
          )
          $exe = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              $exe = Get-ChildItem $c -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) { break }
            }
          }
          if (-not $exe) {
            Write-Host "swift.exe not found under: $($candidates -join ', ')"
            foreach ($c in $candidates) {
              if (Test-Path $c) {
                Write-Host "tree of ${c}:"
                Get-ChildItem $c -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.FullName)" }
              }
            }
            exit 1
          }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "swift.exe at $($exe.FullName)"
          swift --version

      - name: Run spike
        shell: pwsh
        run: ./scripts/windows-spike.ps1

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-logs
          path: |
            spike-*.txt
            spike-census.json
          if-no-files-found: warn
