name: Windows Port Spike (M1)

# Manual, cloud-hosted Windows compile experiment (see docs/WINDOWS_PORT_RFC.md).
# The Swift Windows installer is a WiX Burn bundle (NOT Inno Setup): split it
# with dark, then unpack each payload MSI with msiexec /a (Microsoft's own
# unpacker — scoop's 7z-based Expand-MsiArchive failed on windows.msi, 1603).

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scoop = @("$env:USERPROFILE\scoop\shims\scoop.cmd","C:\Users\runneradmin\scoop\shims\scoop.cmd") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $scoop) { iwr -useb https://get.scoop.sh | iex; $scoop = "$env:USERPROFILE\scoop\shims\scoop.cmd" }
          & $scoop install dark
          $dark = "$env:USERPROFILE\scoop\shims\dark.exe"
          if (-not (Test-Path $dark)) { $dark = (Get-ChildItem "$env:USERPROFILE\scoop\apps\dark" -Recurse -Filter dark.exe | Select-Object -First 1).FullName }
          $url = "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift.exe"
          curl.exe -sSL --fail --max-time 600 -o $installer $url
          Write-Host "downloaded $((Get-Item $installer).Length) bytes"
          $burn = "$env:RUNNER_TEMP\burn"
          New-Item -ItemType Directory -Force -Path $burn | Out-Null
          # scoop's Expand-DarkArchive calls `dark -X:<dir> <bundle>` — capital X
          # with colon. Run #10's lowercase `-x <dir>` extracted only the UX
          # container (printed "swift.exe", 2 s) and left AttachedContainer empty.
          & $dark "-X:$burn" $installer
          Write-Host "dark exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "burn top-level:"
          Get-ChildItem $burn -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          $msiDir = "$burn\AttachedContainer"
          if (-not (Test-Path $msiDir)) { Write-Host "no AttachedContainer; tree:"; Get-ChildItem $burn -Recurse | Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          $out = "$env:RUNNER_TEMP\swifttoolchain"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($m in (Get-ChildItem $msiDir -Filter *.msi)) {
            Write-Host "unpacking $($m.Name) ($([math]::Round($m.Length/1MB)) MB)..."
            # TARGETDIR must end with a backslash or msiexec treats it as a file.
            $p = Start-Process msiexec.exe -ArgumentList "/a","`"$($m.FullName)`"","/qn","TARGETDIR=`"$out\`"" -PassThru -Wait
            Write-Host "  msiexec exit $($p.ExitCode)"
          }
          $exe = Get-ChildItem $out -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "no swift.exe; tree:"; Get-ChildItem $out -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName }; exit 1 }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "swift.exe at $($exe.FullName)"
          swift --version

      - name: Run spike
        shell: pwsh
        run: ./scripts/windows-spike.ps1

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-logs
          path: |
            spike-*.txt
            spike-census.json
          if-no-files-found: warn
