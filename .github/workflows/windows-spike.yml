name: Windows Port Spike (M1)

# Manual, cloud-hosted Windows compile experiment (see docs/WINDOWS_PORT_RFC.md).
# No local Windows machine needed: runs on a GitHub-hosted windows-latest runner,
# installs the official Swift toolchain, and measures how much of OPCCompanyCore
# compiles on Windows. Logs are uploaded as artifacts + a summary on the run page.

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # KEY FINDING (run #7): the Swift Windows .exe is NOT Inno Setup — it's a
          # WiX Burn bundle (AttachedContainer/*.msi). That's why innoextract said
          # "Not a supported Inno Setup installer" and 7-Zip saw only 9 stub files.
          # GitHub's windows runner ships scoop, whose swift manifest unpacks the
          # Burn bundle correctly (Expand-DarkArchive + Expand-MsiArchive). The
          # runner image also carries VS 2022 Build Tools + Windows SDK, which the
          # Swift toolchain needs to actually compile.
          scoop --version
          scoop install swift
          $root = (scoop prefix swift)
          $exe = Get-ChildItem $root -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "swift.exe not found under scoop prefix $root"; exit 1 }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "swift.exe at: $($exe.FullName)"
          swift --version

      - name: Run spike
        shell: pwsh
        run: ./scripts/windows-spike.ps1

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: windows-spike-logs
          path: spike-*.txt
          if-no-files-found: warn
