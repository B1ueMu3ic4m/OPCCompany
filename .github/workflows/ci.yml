name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    # Package.swift declares swift-tools-version 6.3 (needs Xcode 26.x).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Build (release)
        # v0.15 lesson: a SwiftUI expression that type-checks fine under
        # debug CI timed out under release optimization — catch
        # release-only breakage HERE, not in the packaging step.
        run: swift build -c release

      - name: Test
        run: swift test --no-parallel

      - name: L10n audit (every .L() key must resolve)
        run: python3 scripts/l10n_audit.py
