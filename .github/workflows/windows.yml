name: Windows Build (opc CLI)

# Continuous Windows compilation of the portable core + headless CLI —
# the production counterpart of the one-off spike workflow (windows-spike.yml).
# Toolchain install sequence is the EXACT mechanism validated by spikes #5–#9
# (Burn /quiet + INSTALLSCOPE=machine + toolchain DLLs on PATH + SDKROOT),
# stripped of all the diagnostic detours (registry dumps proved to be a red
# herring; scoop's recipe — SDKROOT — is the real mechanism).
#
# Artifact: opc.exe (headless CLI). The GUI needs the Flutter shell (M3) and
# is not part of this build yet.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/OPC/**'
      - 'Sources/OPCCompanyCore/**'
      - 'Sources/CSQLite/**'
      - 'Sources/CWinDPAPI/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # VS17 toolset (spike lesson: the VS2026 image breaks Swift SDK detection)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $url = "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          curl.exe -sSL --fail --max-time 600 -o $installer $url
          # INSTALLSCOPE=machine writes HKLM + Program Files (GH runners are
          # elevated; spike #5-#9 runs all used this exact sequence).
          $p = Start-Process $installer -ArgumentList "/quiet","/norestart","INSTALLSCOPE=machine" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

          $root = "C:\Program Files\Swift"
          if (-not (Test-Path $root)) { $root = "$env:LOCALAPPDATA\Programs\Swift" }
          $exe = Get-ChildItem $root -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "swift.exe NOT FOUND"; exit 1 }

          # Toolchain DLL dirs on PATH or every compile false-fails 0xC0000135.
          $dllDirs = Get-ChildItem $root -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
                     Select-Object -ExpandProperty DirectoryName -Unique
          $env:PATH = ($dllDirs -join ';') + ';' + $env:PATH

          # THE mechanism (scoop's recipe): SDKROOT points swift-driver at the
          # Windows.sdk inside the platform bundle. Registry keys are NOT needed.
          $platDir = Get-ChildItem $root -Recurse -Directory -Filter "Windows.platform" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $platDir) { Write-Host "no Windows.platform under $root"; exit 1 }
          $sdk = Join-Path $platDir.FullName "Developer\SDKs\Windows.sdk"
          if (-not (Test-Path $sdk)) { Write-Host "missing SDK dir $sdk"; exit 1 }
          # Persist env for the LATER build step (GITHUB_ENV/GITHUB_PATH).
          "SDKROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $bin = $exe.DirectoryName
          (($dllDirs + @($bin)) -join ';') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "toolchain ready: SDKROOT=$sdk"

      - name: Build opc.exe (release)
        shell: pwsh
        run: |
          swift build -c release --product opc
          $bin = ".build\release\opc.exe"
          if (-not (Test-Path $bin)) { Write-Host "opc.exe missing"; exit 1 }
          & $bin version   # runtime proof, not just a compile
          & $bin help | Select-Object -First 3

      - name: Build OPCCompanyBridge.dll + verify exports
        shell: pwsh
        run: |
          # The Flutter shell's dependency: a C-ABI DLL from the same core.
          # This step is the production probe for @_cdecl + malloc/free on
          # Windows — if .dynamic can't build here, the M3 shell story must
          # know it now, not at app-link time.
          swift build -c release --product OPCCompanyBridge
          $dll = ".build\release\OPCCompanyBridge.dll"
          if (-not (Test-Path $dll)) { Write-Host "bridge DLL missing"; exit 1 }
          Write-Host "DLL: $((Get-Item $dll).Length) bytes"
          # Exports must carry all six symbols (dumpbin ships with the VS
          # toolset the Swift toolchain already required).
          $dumpbin = (Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Host*\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ($dumpbin) {
            $exports = & $dumpbin.FullName /EXPORTS $dll | Out-String
            foreach ($sym in "opc_bridge_create","opc_bridge_destroy","opc_bridge_last_error","opc_bridge_snapshot_json","opc_bridge_command","opc_bridge_free") {
              if ($exports -notmatch $sym) { Write-Host "MISSING EXPORT: $sym"; exit 1 }
              Write-Host "export ok: $sym"
            }
          } else {
            # Fallback without dumpbin: the import library at least proves the
            # linker saw the exports; symbol names live in the binary image.
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $dll))
            $text = [Text.Encoding]::ASCII.GetString($bytes)
            foreach ($sym in "opc_bridge_create","opc_bridge_command","opc_bridge_free") {
              if ($text -notmatch [regex]::Escape($sym)) { Write-Host "symbol string absent: $sym"; exit 1 }
            }
            Write-Host "export strings present (dumpbin unavailable)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opc-windows-x86_64
          path: |
            .build/release/opc.exe
            .build/release/OPCCompanyBridge.dll
          if-no-files-found: error
