name: Windows Shell

# M3 end-to-end assembly on Windows: the bridge DLL (same toolchain as
# windows.yml) + a Flutter release build of the shell + the DLL dropped
# beside the exe. The packaging story for `OPCCompanyShell` on Windows,
# gated on the exact artifact layout a user would copy.
#
# Supply-chain policy (see scripts/scan-secrets.sh rationale): Flutter is
# fetched from Google's OFFICIAL release infra pinned to the same stable we
# develop on (3.41.5) — no third-party flutter actions.

on:
  push:
    branches: [main]
    paths:
      - 'flutter_shell/**'
      - 'Sources/OPCCompanyCore/OPCBridge.swift'
      - 'Package.swift'
      - '.github/workflows/windows-shell.yml'
  pull_request:
    paths:
      - 'flutter_shell/**'
      - 'Sources/OPCCompanyCore/OPCBridge.swift'
      - 'Package.swift'
      - '.github/workflows/windows-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.5
  SWIFT_BUILD_DIR: .build\x86_64-unknown-windows-msvc

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift toolchain
        timeout-minutes: 25
        shell: pwsh
        run: |
          $url = "https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe"
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          curl.exe -sSL --fail --max-time 600 -o $installer $url
          # INSTALLSCOPE=machine writes HKLM + Program Files (GH runners are
          # elevated; spike #5-#9 runs all used this exact sequence).
          $p = Start-Process $installer -ArgumentList "/quiet","/norestart","INSTALLSCOPE=machine" -PassThru -Wait
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

          $root = "C:\Program Files\Swift"
          if (-not (Test-Path $root)) { $root = "$env:LOCALAPPDATA\Programs\Swift" }
          $exe = Get-ChildItem $root -Recurse -Filter swift.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Host "swift.exe NOT FOUND"; exit 1 }

          # Toolchain DLL dirs on PATH or every compile false-fails 0xC0000135.
          $dllDirs = Get-ChildItem $root -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
                     Select-Object -ExpandProperty DirectoryName -Unique
          $env:PATH = ($dllDirs -join ';') + ';' + $env:PATH

          # THE mechanism (scoop's recipe): SDKROOT points swift-driver at the
          # Windows.sdk inside the platform bundle. Registry keys are NOT needed.
          $platDir = Get-ChildItem $root -Recurse -Directory -Filter "Windows.platform" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $platDir) { Write-Host "no Windows.platform under $root"; exit 1 }
          $sdk = Join-Path $platDir.FullName "Developer\SDKs\Windows.sdk"
          if (-not (Test-Path $sdk)) { Write-Host "missing SDK dir $sdk"; exit 1 }
          # Persist env for the LATER build step (GITHUB_ENV/GITHUB_PATH).
          "SDKROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $bin = $exe.DirectoryName
          (($dllDirs + @($bin)) -join ';') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "toolchain ready: SDKROOT=$sdk"

      - name: Build bridge DLL (release)
        shell: pwsh
        run: |
          swift build -c release --product OPCCompanyBridge
          $dll = Get-ChildItem -Path .build -Recurse -Filter OPCCompanyBridge.dll |
                 Where-Object { $_.FullName -match 'release' } |
                 Select-Object -First 1
          if (-not $dll) { Write-Host "DLL not found under .build"; exit 1 }
          Write-Host "DLL at $($dll.FullName) ($($dll.Length) bytes)"
          Copy-Item $dll.FullName "$env:RUNNER_TEMP\OPCCompanyBridge.dll"

      - name: Install pinned Flutter SDK (official infra)
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_${env:FLUTTER_VERSION}-stable.zip"
          Write-Host "fetch $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\flutter.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\flutter.zip" -DestinationPath "$env:GITHUB_WORKSPACE\flutter-sdk"
          "$env:GITHUB_WORKSPACE\flutter-sdk\flutter\bin" | Add-Content -Path $env:GITHUB_PATH

      - name: Flutter doctor (version pin assertion)
        shell: pwsh
        run: |
          flutter --version
          flutter config --no-analytics
          if (-not (flutter --version | Select-String -Quiet "$env:FLUTTER_VERSION")) {
            Write-Host "flutter version drift — expected $env:FLUTTER_VERSION"; exit 1
          }
          flutter doctor -v | Select-String -Pattern 'Visual Studio|Windows'

      - name: Build shell (release) + assemble package
        shell: pwsh
        working-directory: flutter_shell
        run: |
          flutter pub get
          flutter build windows --release
          $rel = Get-ChildItem -Path build -Recurse -Directory -Filter Release |
                 Where-Object { $_.FullName -match 'runner' } |
                 Select-Object -First 1
          if (-not $rel) { Write-Host "no Release dir under build/"; exit 1 }
          # The bridge lands beside the exe: Dart's DynamicLibrary.open(
          # 'OPCCompanyBridge.dll') hits the exe-directory search order first.
          Copy-Item "$env:RUNNER_TEMP\OPCCompanyBridge.dll" $rel.FullName
          Get-ChildItem $rel.FullName | Select-Object Name, Length
          $exe = Get-ChildItem $rel.FullName -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "no exe in Release dir"; exit 1 }
          if (-not (Test-Path "$($rel.FullName)\OPCCompanyBridge.dll")) {
            Write-Host "assembly failed"; exit 1
          }
          # fixed staging path for the artifact upload (the build tree layout
          # varies across Flutter versions — search once, stage once)
          $stage = "$env:RUNNER_TEMP\shell-package"
          Copy-Item $rel.FullName $stage -Recurse
          Write-Host "staged: $stage"

      - name: Run shell behavioral smoke on the assembled package
        shell: pwsh
        run: |
          # The same 10-check cycle macOS runs — NOW against the Windows DLL
          # through the Windows exe: dlopen path, cdecl calls, main-thread
          # hop under a real message loop. A fresh support dir bootstraps a
          # factory company (verified on macOS: 3 tasks, goal -> +4), so the
          # relative assertions hold without seeding.
          $pkg = "$env:RUNNER_TEMP\shell-package"
          $exe = Get-ChildItem $pkg -Filter *.exe | Select-Object -First 1
          $work = "$env:RUNNER_TEMP\shell-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $verdict = "$work\verdict.json"
          Remove-Item $verdict -ErrorAction SilentlyContinue
          $env:OPC_SHELL_SMOKE = "1"
          $env:OPC_SHELL_SMOKE_OUT = $verdict
          $env:OPC_COMPANY_SUPPORT_DIR = "$work\support"
          $p = Start-Process $exe.FullName -PassThru
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force
            Write-Host "smoke app did not exit in 180s"; exit 1
          }
          if (-not (Test-Path $verdict)) { Write-Host "no verdict file"; exit 1 }
          $v = Get-Content $verdict -Raw
          Write-Host $v
          if ($v -notmatch '"ok":true') { Write-Host "smoke NOT all-pass"; exit 1 }
          Write-Host "WINDOWS SHELL SMOKE: ALL PASS"

      - name: Upload assembled shell package
        uses: actions/upload-artifact@v4
        with:
          name: opc-shell-windows-x86_64
          path: ${{ runner.temp }}/shell-package/
          if-no-files-found: error
